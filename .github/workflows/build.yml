name: Build Kernel for Samsung Galaxy A05

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    name: Build A05 Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libelf-dev python3 python-is-python3 zip unzip curl rsync cpio python3-pip
          pip3 install gdown

      - name: Download and Extract Toolchain
        run: |
          gdown 1vsQfRgdNHlD0md9tF7j5fpkL_17whzbH -O toolchain.tar.gz
          tar -xf toolchain.tar.gz
          rm -f toolchain.tar.gz

      - name: Compile Kernel
        run: |
          bash build_kernel.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: A055F-Kernel-Droidspaces
          path: a05m-*.zip
